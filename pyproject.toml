[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kasra-mcp-server"
version = "1.2.0"
description = "Kasra Lite attendance, personal requests and manager workflows over MCP"
readme = "README.md"
authors = [{ name = "Emad Razavi", email = "razavioo@gmail.com" }]
license = "MIT"
keywords = ["mcp", "model-context-protocol", "kasra", "attendance", "fastmcp"]
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.14,<3", "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5", "pycryptodome>=3.23,<4", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
kasra-mcp-server = "main:main"
teamik-kasra-mcp = "main:main"

[project.urls]
Homepage = "https://github.com/razavioo/kasra-mcp-server"
Repository = "https://github.com/razavioo/kasra-mcp-server"

[tool.setuptools]
py-modules = ["main", "server", "kasra_client", "organization", "manager_tools", "personal", "personal_tools", "runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
